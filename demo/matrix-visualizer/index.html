<!DOCTYPE html>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {

<body>
<h1>EasyMath Matrix Visualizer</h1>
<p>选择一种演示模式，探索 3D 矩阵变换的奥秘</p>
